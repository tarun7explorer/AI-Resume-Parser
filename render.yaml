services:
  - type: web
    name: resume-parser
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SCREENING_WORKER_ENABLED
        value: "false"
      - key: GROQ_API_KEY
        sync: false
