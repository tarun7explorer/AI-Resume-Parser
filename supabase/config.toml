# Local Supabase stack settings. No project credentials are stored here.
project_id = "ai-resume-screening"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:8000"
additional_redirect_urls = ["http://localhost:8000"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
# Keep the email provider enabled for provisioned recruiter accounts while
# disabling public signup with the top-level [auth] setting above.
enable_signup = true
enable_confirmations = true
